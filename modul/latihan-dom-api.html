<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan DOM & API</title>
</head>
<body>

    <h1>Latihan DOM & API</h1>

    <h2>1. Ubah Teks</h2>
    <p id="teks">Teks sebelum diubah.</p>
    <button id="btnUbah">Ubah Teks</button>

    <h2>2. Form Validasi</h2>
    <form id="formNama">
        <input type="text" id="inputNama" placeholder="Masukkan nama">
        <button type="submit">Kirim</button>
    </form>
    <p id="pesanNama"></p>

    <h2>3. LocalStorage</h2>
    <input type="text" id="inputCatatan" placeholder="Tulis catatan">
    <button id="btnSimpan">Simpan Catatan</button>
    <button id="btnTampil">Tampilkan Catatan</button>
    <p id="hasilCatatan"></p>

    <h2>4. Dark Mode</h2>
    <button id="btnMode">Ganti Mode</button>

    <h2>5. Data API</h2>
    <button id="btnAPI">Ambil Data</button>
    <ul id="hasilAPI"></ul>

    <script src="latihan-dom-api.js"></script>
</body>
</html>
