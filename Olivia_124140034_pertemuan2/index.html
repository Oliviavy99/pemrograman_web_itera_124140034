<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dashboard tugas kuliah Olivia, NIM 124140034, kelas RB.">
    <title>Dashboard Kuliah Olivia</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./js/app.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Dashboard Kuliah</h1>
            <p>
                Olivia · NIM 124140034 · Kelas RB
            </p>
        </header>

        <main>
            <p id="storage-warning" role="alert" hidden></p>
            <p id="message" role="status" aria-live="polite"></p>

            <!-- Formulir tambah dan edit tugas -->
            <section aria-labelledby="form-title">
                <h2 id="form-title">Tambah tugas</h2>

                <form id="task-form">
                    <input type="hidden" name="id" value="">

                    <div class="field">
                        <label for="task-title">Judul tugas (wajib)</label>
                        <input id="task-title" name="title" type="text" required maxlength="100">
                    </div>

                    <div class="field">
                        <label for="task-course">Mata kuliah (wajib)</label>
                        <input id="task-course" name="course" type="text" required maxlength="60">
                    </div>

                    <div class="field">
                        <label for="task-deadline">Tenggat (wajib)</label>
                        <input id="task-deadline" name="deadline" type="date" required>
                    </div>

                    <div class="field">
                        <label for="task-priority">Prioritas</label>
                        <select id="task-priority" name="priority">
                            <option value="rendah">Rendah</option>
                            <option value="sedang" selected>Sedang</option>
                            <option value="tinggi">Tinggi</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button type="submit">Tambah tugas</button>
                        <button id="cancel-edit" type="button" hidden>Batal edit</button>
                    </div>
                </form>
            </section>

            <!-- Contoh tugas dari API JSONPlaceholder -->
            <section aria-labelledby="sample-title">
                <h2 id="sample-title">API JSONPlaceholder</h2>
                <p>
                    Muat 5 tugas
                </p>

                <button id="load-samples" type="button">Muat 5 tugas</button>
                <p id="sample-status" role="status" aria-live="polite">
                    Klik tombol untuk memuat tugas.
                </p>
            </section>

            <!-- Daftar tugas yang dapat dikelola -->
            <section aria-labelledby="tasks-title">
                <h2 id="tasks-title">Daftar tugas</h2>
                <p id="task-count">
                    Total: 0 tugas · Selesai: 0 tugas
                </p>
                <div id="task-list"></div>
                <p id="empty-state" hidden>Belum ada tugas</p>

                <noscript>
                    <p>
                        Aktifkan JavaScript untuk mengelola tugas dan memuat contoh API.
                    </p>
                </noscript>
            </section>
        </main>

        <footer>
            <p>
                <a href="./README.md">Dokumentasi README</a>
            </p>
        </footer>
    </div>
</body>
</html>
