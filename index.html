<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini POS - Olivia</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Mini POS</h1>
        <p>Kasir Sederhana</p>

        <hr>

        <h2>Tambah Barang</h2>

        <form id="formBarang">

            <label for="namaBarang">Nama Barang</label>
            <input type="text" id="namaBarang" placeholder="Contoh: Buku Tulis">
            <small id="errorNama"></small>

            <label for="hargaBarang">Harga Satuan</label>
            <input type="number" id="hargaBarang" placeholder="Minimal Rp500">
            <small id="errorHarga"></small>

            <label for="qtyBarang">Jumlah / Qty</label>
            <input type="number" id="qtyBarang" placeholder="Minimal 1">
            <small id="errorQty"></small>

            <button type="submit">Tambah ke Keranjang</button>

        </form>

        <hr>

        <h2>Keranjang Belanja</h2>

        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Nama Barang</th>
                    <th>Harga Satuan</th>
                    <th>Qty</th>
                    <th>Subtotal</th>
                    <th>Aksi</th>
                </tr>
            </thead>

            <tbody id="keranjangBody">
            </tbody>
        </table>

        <p id="keranjangKosong">
            Belum ada barang di keranjang.
        </p>

        <hr>

        <h2>Ringkasan Pembayaran</h2>

        <p>
            Total Belanja:
            <strong id="totalBelanja">Rp0</strong>
        </p>

        <p>
            Diskon:
            <strong id="diskon">Rp0</strong>
        </p>

        <p>
            Total Akhir:
            <strong id="totalAkhir">Rp0</strong>
        </p>

        <label for="uangBayar">Uang Bayar</label>
        <input type="number" id="uangBayar" placeholder="Masukkan uang bayar">

        <p id="pesanPembayaran"></p>

        <p>
            Kembalian:
            <strong id="kembalian">Rp0</strong>
        </p>

        <button id="btnReset" type="button">
            Transaksi Baru
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
